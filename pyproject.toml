[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "GSGTestRepo"
dynamic = ["version"]
description = "test"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Solveit", email = "nobody@fast.ai"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Repository = "https://github.com/gsgbills/GSGTestRepo"
Documentation = "https://gsgbills.github.io/GSGTestRepo/"

[project.entry-points.nbdev]
GSGTestRepo = "GSGTestRepo._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "GSGTestRepo.__version__"}

[tool.setuptools.packages.find]
include = ["GSGTestRepo"]

[tool.nbdev]
